<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="main-container">
        <div id="result">0</div>
        <div class="row row-1">
            <div class="btn" id="ac" onclick="clearResult()">AC</div>
            <div class="btn" onclick="del()">Del</div>
            <div class="btn" onclick="updateResultBar(this)">%</div>
            <div class="btn" onclick="updateResultBar(this)">÷</div>
        </div>
        <div class="row">
            <div class="btn" onclick="updateResultBar(this)">7</div>
            <div class="btn" onclick="updateResultBar(this)">8</div>
            <div class="btn" onclick="updateResultBar(this)">9</div>
            <div class="btn" onclick="updateResultBar(this)">x</div>
        </div>
        <div class="row">
            <div class="btn" onclick="updateResultBar(this)">4</div>
            <div class="btn" onclick="updateResultBar(this)">5</div>
            <div class="btn" onclick="updateResultBar(this)">6</div>
            <div class="btn" onclick="updateResultBar(this)">-</div>
        </div>
        <div class="row">
            <div class="btn" onclick="updateResultBar(this)">1</div>
            <div class="btn" onclick="updateResultBar(this)">2</div>
            <div class="btn" onclick="updateResultBar(this)">3</div>
            <div class="btn" onclick="updateResultBar(this)">+</div>
        </div>
        <div class="row">
            <div id="zero" onclick="updateResultBar(this)">0</div>
            <div class="btn" onclick="updateResultBar(this)">.</div>
            <div class="btn" id="equal" onclick="calculateResult()">=</div>
        </div>
    </div>
</body>
<script src="js/app.js"></script>

</html>
